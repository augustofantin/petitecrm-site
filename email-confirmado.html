<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PetiteCRM — E-mail confirmado</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F9F6EF;
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #541F19;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
      background: #FFFFFF;
      border: 1px solid #E6C5BD;
      border-radius: 20px;
      padding: 32px 28px;
      text-align: center;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 12px;
    }
    p {
      margin: 0;
      line-height: 1.5;
      color: #7C4A42;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>E-mail confirmado!</h1>
    <p>Sua conta no PetiteCRM foi confirmada com sucesso. Pode fechar esta aba e abrir o
    aplicativo PetiteCRM para entrar normalmente.</p>
  </div>
</body>
</html>
